name: Sync Substack posts

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/substack.yml
      - scripts/fetch_substack.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_substack.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- feed.json; then echo "no new posts"; exit 0; fi
          git config user.name "r9r-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Sync Substack posts"
          git push
